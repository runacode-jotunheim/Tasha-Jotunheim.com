<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Оплата не завершена — Артефакты Йотунхейм</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:'VT323';src:url('assets/fonts/vt323-latin-400-normal.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Share Tech Mono';src:url('assets/fonts/share-tech-mono-latin-400-normal.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Cinzel';src:url('assets/fonts/cinzel-latin-900-normal.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}
:root{--red:#ff2020;--accent:var(--red)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%}
body{color:var(--accent);font-family:'Share Tech Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.box{max-width:440px;border:1px solid rgba(255,32,32,0.3);border-radius:16px;padding:44px 32px;background:rgba(255,32,32,0.03)}
.rune{font-family:'VT323',monospace;font-size:56px;margin-bottom:18px;text-shadow:0 0 20px var(--accent)}
h1{font-family:'Cinzel',serif;font-size:22px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;text-shadow:0 0 16px rgba(255,32,32,0.4)}
p{font-size:13px;line-height:1.8;color:rgba(255,230,230,0.75);margin-bottom:10px}
a.btn{display:inline-block;margin-top:18px;padding:12px 26px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);text-decoration:none;font-family:'VT323',monospace;font-size:16px;letter-spacing:2px;text-transform:uppercase}
a.btn:hover{background:var(--accent);color:#000}
</style>
</head>
<body>
<div class="box">
  <div class="rune">ᛉ</div>
  <h1>Оплата не завершена</h1>
  <p>Платёж не прошёл или был отменён. Деньги не списаны.</p>
  <p>Можно попробовать ещё раз из корзины, либо оформить заказ вручную через Telegram.</p>
  <a class="btn" href="https://t.me/JotunSpirit">Написать в Telegram</a><br>
  <a class="btn" href="index.html" style="margin-top:10px">Вернуться в магазин</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Игры Самайна — Артефакты Йотунхейм</title>
<style>
@font-face{font-family:'VT323';src:url('../assets/fonts/vt323-latin-400-normal.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Share Tech Mono';src:url('../assets/fonts/share-tech-mono-latin-400-normal.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Cinzel';src:url('../assets/fonts/cinzel-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Cinzel';src:url('../assets/fonts/cinzel-latin-900-normal.woff2') format('woff2');font-weight:900;font-display:swap}
:root{--acc:#00ff41;--pump:#ffb35c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--acc);font-family:'Share Tech Mono',monospace;min-height:100%}
body{padding:0 16px 40px;background:radial-gradient(ellipse at 50% -10%,rgba(255,122,26,0.13),transparent 60%),#000}
.sg-head{max-width:720px;margin:0 auto;padding:16px 0 8px}
.sg-back{color:rgba(0,255,65,0.7);text-decoration:none;font-family:'VT323',monospace;font-size:18px;letter-spacing:1px}
.sg-hub{max-width:720px;margin:0 auto;text-align:center}
.sg-eye{font-size:10px;letter-spacing:6px;color:rgba(0,255,65,0.5);text-transform:uppercase}
.sg-hub h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(26px,7vw,40px);letter-spacing:3px;text-transform:uppercase;margin:10px 0 8px;text-shadow:0 0 18px rgba(0,255,65,0.4)}
.sg-sub{font-size:13px;color:rgba(200,255,218,0.7);margin-bottom:24px;line-height:1.6}
.sg-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sg-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border:1px solid rgba(0,255,65,0.28);border-radius:16px;overflow:hidden;background:rgba(0,255,65,0.03);text-align:left;transition:transform .15s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.sg-tile:active{transform:scale(0.97)}
.sg-tile:hover{border-color:var(--acc);box-shadow:0 0 18px rgba(0,255,65,0.2)}
.sg-prev{width:100%;aspect-ratio:1/1;display:block;image-rendering:pixelated}
.sg-tile-info{padding:10px 12px 14px}
.sg-tile-name{font-family:'Cinzel',serif;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--pump);margin-bottom:4px}
.sg-tile-desc{font-size:11px;line-height:1.5;color:rgba(200,255,218,0.7);margin-bottom:8px}
.sg-tile-meta{font-family:'VT323',monospace;font-size:16px;letter-spacing:1px;color:var(--acc)}

#sg-game{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#sg-game.open{display:flex}
.sg-hud{display:flex;align-items:center;gap:10px;padding:10px 12px;font-family:'VT323',monospace;font-size:clamp(22px,1.5vw,36px);letter-spacing:1px}
.sg-x{all:unset;cursor:pointer;width:clamp(36px,2.2vw,52px);height:clamp(36px,2.2vw,52px);border:1px solid rgba(0,255,65,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--acc);flex-shrink:0}
#sg-score{flex:1;color:var(--pump);white-space:nowrap}
#sg-mid{flex:1;text-align:center;white-space:nowrap}
#sg-lives{flex:1;display:flex;justify-content:flex-end;gap:4px;white-space:nowrap}
#sg-score,#sg-mid{display:flex;align-items:center;gap:6px}
#sg-mid{justify-content:center}
.sg-ico{display:block;flex-shrink:0}
#sg-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
#sg-canvas{display:block;border-radius:12px;border:1px solid rgba(0,255,65,0.25);box-shadow:0 0 30px rgba(255,122,26,0.08);image-rendering:pixelated;touch-action:none}
.sg-hint{text-align:center;font-size:11px;color:rgba(0,255,65,0.45);padding:0 12px 14px;min-height:30px;letter-spacing:1px}
.sg-hint:empty{min-height:0;padding:0}
#sg-rotate{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,0.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;padding:24px}
#sg-rotate.show{display:flex}
.sg-rot-phone{width:58px;height:96px;border:3px solid var(--acc);border-radius:12px;position:relative;box-shadow:0 0 22px rgba(0,255,65,0.35);animation:sg-rot 2.2s ease-in-out infinite;margin-bottom:10px}
.sg-rot-screen{position:absolute;inset:8px 5px;border-radius:4px;background:linear-gradient(180deg,#1d0f2e,#27180c)}
@keyframes sg-rot{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.sg-rot-title{font-family:'Cinzel',serif;font-weight:900;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:var(--pump)}
.sg-rot-text{font-size:13px;color:rgba(200,255,218,0.75);margin-bottom:8px}
#sg-rotate .sg-btn{padding:10px 28px}
.sg-goal{font-family:'VT323',monospace;font-size:20px;letter-spacing:1px;color:var(--pump);margin-bottom:14px;line-height:1.2}
.sg-goal b{color:var(--pump)!important}
.sg-rules{display:grid;grid-template-columns:1fr auto;gap:7px 14px;text-align:left;font-size:13px;line-height:1.35;padding:12px 14px;border:1px solid rgba(0,255,65,0.18);border-radius:10px;background:rgba(0,255,65,0.03)}
.sg-rules span{color:rgba(200,255,218,0.8)}
.sg-rules b,.sg-rules i{font-style:normal;text-align:right;white-space:nowrap}
.sg-rules b{color:var(--acc)!important}
.sg-rules i{color:#ff6b6b}
.sg-foot{margin-top:12px;font-size:10px;line-height:1.5;color:rgba(200,255,218,0.5);text-align:left}
.sg-foot a{color:var(--acc)}
.sg-jc{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:0.82em;letter-spacing:0.5px}
#sg-ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.72);padding:16px}
#sg-ov.show{display:flex}
.sg-ov-card{width:100%;max-width:380px;max-height:calc(100% - 8px);overflow-y:auto;border:1px solid rgba(0,255,65,0.4);border-radius:16px;background:rgba(0,8,3,0.95);padding:24px 20px;text-align:center}
#sg-ov-title{font-family:'Cinzel',serif;font-weight:900;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:var(--pump);margin-bottom:12px}
#sg-ov-text{font-size:13px;line-height:1.7;color:rgba(200,255,218,0.8);margin-bottom:20px}
#sg-ov-text b{color:var(--acc);font-weight:normal}
#sg-ov-btns{display:flex;flex-direction:column;gap:10px}
.sg-btn{all:unset;cursor:pointer;background:var(--acc);color:#000;padding:11px 0;border-radius:10px;font-family:'VT323',monospace;font-size:20px;letter-spacing:3px;text-transform:uppercase;text-align:center}
.sg-btn.ghost{background:transparent;color:var(--acc);border:1px solid rgba(0,255,65,0.5)}
.sg-code{margin-top:14px;padding:10px;border:1px dashed rgba(255,179,92,0.6);border-radius:8px;color:var(--pump);font-size:12px}
@media (orientation:landscape) and (max-height:520px){
  .sg-ov-card{max-width:720px;padding:14px 18px}
  #sg-ov-title{font-size:20px;margin-bottom:6px}
  .sg-goal{font-size:17px;margin-bottom:8px}
  .sg-rules{grid-template-columns:auto auto auto auto;justify-content:space-between;gap:5px 14px;font-size:12px;padding:8px 12px}
  #sg-ov-text{margin-bottom:10px}
  #sg-ov-btns{flex-direction:row}
  #sg-ov-btns .sg-btn{flex:1;padding:8px 0;font-size:18px}
  .sg-foot{margin-top:8px}
}
</style>
</head>
<body>

<header class="sg-head"><a href="../index.html" class="sg-back">&#9664; На сайт</a></header>

<main class="sg-hub">
  <span class="sg-eye">&#9658; самайн 2026</span>
  <h1>Игры Самайна</h1>
  <p class="sg-sub">Выбери игру. Победа — промокод на скидку.</p>
  <div class="sg-tiles">
    <button class="sg-tile" data-game="grave">
      <canvas class="sg-prev" data-prev="grave"></canvas>
      <div class="sg-tile-info">
        <div class="sg-tile-name">Погост</div>
        <div class="sg-tile-desc">Собирай тыквы из могил. Нечисть не трогай.</div>
        <div class="sg-tile-meta">40 сек · 30 тыкв</div>
      </div>
    </button>
    <button class="sg-tile" data-game="runner">
      <canvas class="sg-prev" data-prev="runner"></canvas>
      <div class="sg-tile-info">
        <div class="sg-tile-name">Маленькая ведьма</div>
        <div class="sg-tile-desc">Беги сквозь ночь: прыгай через тыквы, уходи от воронов.</div>
        <div class="sg-tile-meta"><span class="sg-jc">JC</span> · рекорд · 30 конфет</div>
      </div>
    </button>
  </div>
</main>

<div id="sg-game">
  <div class="sg-hud">
    <button class="sg-x" id="sg-close" aria-label="Закрыть">&#10005;</button>
    <div id="sg-score"></div>
    <div id="sg-mid"></div>
    <div id="sg-lives"></div>
  </div>
  <div id="sg-stage"><canvas id="sg-canvas"></canvas></div>
  <div class="sg-hint" id="sg-hint"></div>
  <div id="sg-rotate">
    <div class="sg-rot-phone"><div class="sg-rot-screen"></div></div>
    <div class="sg-rot-title">Поверни телефон</div>
    <div class="sg-rot-text">«Маленькая ведьма» играется только горизонтально</div>
    <button class="sg-btn ghost" id="sg-rotate-back">К играм</button>
  </div>
  <div id="sg-ov">
    <div class="sg-ov-card">
      <div id="sg-ov-title"></div>
      <div id="sg-ov-text"></div>
      <div id="sg-ov-btns"></div>
    </div>
  </div>
</div>

<script src="samhain-games.js?v=15" charset="utf-8"></script>
</body>
</html>
